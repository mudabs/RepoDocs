name: Tests

# Development CI for RepoDocs itself. It runs the complete pytest suite present in the
# commit under test, so tests added by a pull request run automatically.
# Uses pull_request (never pull_request_target): fork code runs without secrets or write access.

on:
  # No branch filter: pull requests stacked on other pull requests (base is not main) get the same checks.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Check names are stable and used by branch protection: "test (ubuntu-latest, 3.11)" etc.
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install project with test dependencies
        run: python -m pip install -e ".[test]"
      # Optional tooling for users, required here: the real, pinned Mermaid renderer (tools/mermaid) draws the
      # generated diagrams so they are checked by Mermaid itself, not only by RepoDocs' own grammar. It uses the
      # Chrome that GitHub-hosted runners provide, so no browser is downloaded.
      - name: Install the pinned Mermaid renderer
        shell: bash
        working-directory: tools/mermaid
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: |
          node --version
          npm ci --ignore-scripts
      - name: Run the complete test suite
        env:
          REPODOCS_REQUIRE_RENDERER: "1"
          REPODOCS_MERMAID_NO_SANDBOX: "1"
        run: python -m pytest -ra

      # Reports the golden-fixture metrics in the log and the job summary. The suite above already
      # fails on any change; this step makes the numbers visible, and shows whether Linux and
      # Windows agree. `shell: bash` makes a pipe fail when the evaluation fails.
      - name: Report golden-fixture quality metrics
        shell: bash
        run: |
          python -m repodocs.golden tests/golden --baseline tests/golden/baseline-report.json --summary | tee -a "$GITHUB_STEP_SUMMARY"

      # Proves, in this shell and with this pipe, that a failing evaluation fails the step. Without
      # `shell: bash` (so without pipefail) the pipe into tee would report success. The baseline here
      # is deliberately wrong, and the output goes to a scratch file so the job summary stays clean.
      - name: A failing evaluation must fail the step
        id: failing-evaluation
        continue-on-error: true
        shell: bash
        run: |
          echo '{}' > "$RUNNER_TEMP/wrong-baseline.json"
          python -m repodocs.golden tests/golden --baseline "$RUNNER_TEMP/wrong-baseline.json" --summary | tee -a "$RUNNER_TEMP/negative-summary.md"

      - name: The failing evaluation must have been reported as a failure
        if: steps.failing-evaluation.outcome != 'failure'
        shell: bash
        run: |
          echo "The evaluation step reported success although the evaluation failed."
          exit 1
