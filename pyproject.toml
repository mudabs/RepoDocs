[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repodocs"
version = "0.1.0"
description = "Evidence-backed documentation for software repositories"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "RepoDocs contributors" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.18", "anthropic>=1.0", "fastapi>=0.115", "httpx>=0.27"]
ai = ["anthropic>=1.0"]
# The optional local web service (ADR-027, ADR-036). The CLI and the shared service never need it.
web = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
repodocs = "repodocs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
