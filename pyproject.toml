[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repodocs"
version = "0.1.0"
description = "Evidence-backed documentation for software repositories"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "RepoDocs contributors" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
repodocs = "repodocs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
